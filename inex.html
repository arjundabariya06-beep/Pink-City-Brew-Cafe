<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
>
<link rel="stylesheet" href="./style.css">
</head>

<body>
     <!-- HEADER / NAVIGATION -->

<header class="fixed inset-x-0 top-0 z-50 border-b border-[var(--line)] bg-[var(--surface)]/95 backdrop-blur-md">

    <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-5 lg:px-8">

        <!-- Logo -->

        <a
            href="index.html"
            class="flex items-center gap-3"
        >

            <span
                class="flex h-11 w-11 items-center justify-center rounded-full bg-[var(--brand)] text-white"
            >
                <i class="fa-solid fa-mug-hot"></i>
            </span>

            <span>

                <span class="block text-lg font-extrabold leading-tight">
                    Pink City
                </span>

                <span class="block text-[10px] font-semibold uppercase tracking-[0.3em] text-[var(--brand)]">
                    Brew Café
                </span>

            </span>

        </a>


        <!-- Desktop Navigation -->

        <nav
            class="hidden items-center gap-7 md:flex"
        >

            <a
                href="index.html"
                class="text-sm font-semibold text-[var(--brand)]"
            >
                Home
            </a>

            <a
                href="about.html"
                class="text-sm font-semibold text-[var(--muted)] transition hover:text-[var(--brand)]"
            >
                About
            </a>

            <a
                href="menu.html"
                class="text-sm font-semibold text-[var(--muted)] transition hover:text-[var(--brand)]"
            >
                Menu
            </a>

            <a
                href="gallery.html"
                class="text-sm font-semibold text-[var(--muted)] transition hover:text-[var(--brand)]"
            >
                Gallery
            </a>

            <a
                href="contact.html"
                class="text-sm font-semibold text-[var(--muted)] transition hover:text-[var(--brand)]"
            >
                Contact
            </a>

        </nav>


        <!-- Desktop CTA -->

        <a
            href=""
            class="hidden items-center gap-2 rounded-full bg-[var(--ink)] px-5 py-3 text-sm font-semibold text-[var(--surface)] transition hover:bg-[var(--brand)] md:flex"
        >

            <i class="fa-regular fa-calendar"></i>

            Reserve a Table

        </a>


        <!-- Mobile Navigation -->

        <details class=" relative md:hidden">

            <summary
                class="flex h-11 w-11 cursor-pointer items-center justify-center rounded-full bg-[var(--ink)] text-[var(--surface)]"
                
            >

                <i class="menu-icon fa-solid fa-bars"></i>

            </summary>


            <div
                class="absolute right-0 top-14 w-72 rounded-2xl border border-[var(--line)] bg-[var(--surface)] p-4 shadow-2xl"
            >

                <nav
                    class="flex flex-col gap-1"
                >

                    <a
                        href="index.html"
                        class="rounded-xl px-4 py-3 text-sm font-semibold hover:bg-[var(--surface-soft)]"
                    >
                        Home
                    </a>

                    <a
                        href="about.html"
                        class="rounded-xl px-4 py-3 text-sm font-semibold hover:bg-[var(--surface-soft)]"
                    >
                        About
                    </a>

                    <a
                        href="menu.html"
                        class="rounded-xl px-4 py-3 text-sm font-semibold hover:bg-[var(--surface-soft)]"
                    >
                        Menu
                    </a>

                    <a
                        href="gallery.html"
                        class="rounded-xl px-4 py-3 text-sm font-semibold hover:bg-[var(--surface-soft)]"
                    >
                        Gallery
                    </a>

                    <a
                        href="contact.html"
                        class="rounded-xl px-4 py-3 text-sm font-semibold hover:bg-[var(--surface-soft)]"
                    >
                        Contact
                    </a>

                    <a
                        href="contact.html"
                        class="mt-2 rounded-xl bg-[var(--brand)] px-4 py-3 text-center text-sm font-bold text-white"
                    >
                        Reserve a Table
                    </a>
                </nav>
            </div>
        </details>

    </div>

</header>
</body>
</html>
